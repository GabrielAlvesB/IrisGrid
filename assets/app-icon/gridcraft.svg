<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    IrisGrid app icon: a spreadsheet page with a header row, a grid and a selected cell with its
    fill handle, the same drawing the Iris Workspace shows (Iris/src/shared/types/workspace.types.ts,
    hue 152). The gradient is its oklch(0.66 0.2 152) → oklch(0.6 0.21 194) in sRGB, so every
    renderer draws the same colours. Every PNG, .ico and .icns in this folder is rendered from this file.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b24e"/>
      <stop offset="1" stop-color="#00a2a5"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#g)"/>
  <rect x="12" y="12" width="40" height="40" rx="4" fill="#fff" fill-opacity=".95"/>
  <path d="M12 16a4 4 0 0 1 4-4h32a4 4 0 0 1 4 4v6H12z" fill="url(#g)" fill-opacity=".4"/>
  <path d="M12 22h40M12 32h40M12 42h40M24.5 12v40M38 12v40" stroke="url(#g)" stroke-width="1.6" stroke-opacity=".6"/>
  <rect x="24.5" y="32" width="13.5" height="10" fill="url(#g)" fill-opacity=".3"/>
  <rect x="24.5" y="32" width="13.5" height="10" fill="none" stroke="url(#g)" stroke-width="2.4"/>
  <rect x="35.6" y="39.6" width="4.8" height="4.8" rx="1" fill="url(#g)" stroke="#fff" stroke-width="1.2"/>
</svg>
